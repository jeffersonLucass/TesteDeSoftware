name: Java CI com Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar projeto
        run: mvn clean compile
        working-directory: Calculadora


  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Executar testes
        run: mvn test
        working-directory: Calculadora

      - name: Publicar relatório JUnit
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: Calculadora/target/surefire-reports/TEST-*.xml


  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simular deploy
        run: |
          echo "Realizando deploy na branch main..."
          echo "Deploy concluído com sucesso!"
